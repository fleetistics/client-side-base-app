buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"

        googlePlayServicesLocationVersion = "21.3.0"  // react-native-background-geolocation

        slf4jVersion = "1.7.36"    // react-native-background-geolocation (logback-android logging)
        logbackVersion = "2.0.1"   // react-native-background-geolocation (logback-android logging)
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.8")
    }
}

allprojects {   // react-native-background-geolocation
    repositories {
        google()
        mavenCentral()
        // Detox (see e2e/, .detoxrc.js): its Android library isn't published to Maven Central
        // (only long-abandoned 0.x releases are) — the npm package ships the current version's
        // AAR as a ready-made local Maven repo instead.
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
    }
    configurations.all {
        // Keep SLF4J on 1.7.x so logback-android provides the expected binding at runtime
        // (background-geolocation's native logger depends on logback-android, which some other
        // dependency can otherwise pull in as SLF4J 2.x and break at runtime).
        resolutionStrategy {
            force "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
